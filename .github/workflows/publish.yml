name: Publish Package

on:
  workflow_dispatch:
  release:
    types: [published]
  push:
    tags:
      - 'v*'

jobs:
  publish-npm:
    name: Publish to npmjs.org
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # Required for npm cryptographic provenance

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      - name: Run Tests
        run: npm test

      - name: Build Package
        run: npm run build

      - name: Publish to npmjs.org
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          if npm view "@0xsharon/click-clack@${CURRENT_VERSION}" version >/dev/null 2>&1; then
            echo "Version ${CURRENT_VERSION} is already published to npmjs.org. Skipping."
          else
            npm publish --access public --provenance
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  publish-github:
    name: Publish to GitHub Packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # Grants write permission to GitHub Packages registry

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://npm.pkg.github.com'

      - name: Install dependencies
        run: npm ci

      - name: Build Package
        run: npm run build

      - name: Publish to GitHub Packages
        run: |
          npm publish || echo "Package version may already exist on GitHub Packages. Skipping."
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

